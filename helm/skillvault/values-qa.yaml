image:
  repository: comsatel/skillvault
  tag: "0.6.3"
  pullPolicy: Always

replicaCount: 1

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-qa"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: skillvault.qa.comsatel.com.pe
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: skillvault-qa-tls
      hosts:
        - skillvault.qa.comsatel.com.pe

auth:
  trustHost: "true"
  url: "https://skillvault.qa.comsatel.com.pe"
  keycloak:
    id: "skillvault"
    issuer: "https://oauth2.qa.comsatel.com.pe/realms/Apps"

mysql:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 512Mi

nodeSelector: {}

tolerations: []