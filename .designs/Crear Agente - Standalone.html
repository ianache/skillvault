  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t-2: #d9822b;\n  --sv-accent-2-rgb: 217, 130, 43;\n\n  /* Status */\n  --sv-teal: #0f9488;\n  --sv-teal-rgb: 15, 148, 136;\n  --sv-danger: #b3392f;\n  --sv-text-rgb: 26, 29, 33;\n\n  /* Dark sidebar (merged from Publicar Skill) */\n  --sv-sidebar-bg: #1c1a17;\n  --sv-sidebar-border: #302c26;\n  --sv-sidebar-text: #c9c5bd;\n  --sv-sidebar-text-dim: #6f6a5d;\n  --sv-sidebar-active-bg: rgba(169, 119, 46, 0.28);\n  --sv-sidebar-active-text: #e8ab6a;\n\n  /* Dark mode (content area) */\n  --sv-dark-bg: #16140f;\n  --sv-dark-surface: #221f19;\n  --sv-dark-border: #34302a;\n  --sv-dark-text: #f2efe9;\n  --sv-dark-text-muted: #a8a196;\n\n  /* Overlay */\n  --sv-backdrop-rgb: 26, 29, 33;\n  --sv-shadow-rgb: 20, 20, 20;\n  --sv-shadow-sm: 0 1px 2px rgba(20, 20, 20, 0.04);\n  --sv-shadow-md: 0 12px 32px rgba(20, 20, 20, 0.14);\n  --sv-shadow-lg: 0 20px 60px rgba(20, 20, 20, 0.2);\n\n  /* Type */\n  --sv-font-display: 'Space Grotesk', sans-serif;\n  --sv-font-mono: 'JetBrains Mono', monospace;\n\n  /* Radius */\n  --sv-radius-sm: 6px;\n  --sv-radius-md: 8px;\n  --sv-radius-lg: 12px;\n  --sv-radius-pill: 20px;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; background: var(--sv-bg); }\n    a { color: var(--sv-accent); }\n    a:hover { color: var(--sv-accent-dark); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<dc-import name=\"App Shell\" active-item=\"Agentes\" breadcrumb=\"{{ breadcrumb }}\" page-title=\"Crear agente\" page-description=\"Define la responsabilidad del agente, sus entregables y los skills que le dan capacidad para cumplirlos.\" page-actions=\"{{ pageActions }}\" hint-size=\"100%,100vh\">\n\n  <div style=\"display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: start;\">\n\n    <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n\n      <div style=\"background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: 12px; box-shadow: var(--sv-shadow-sm); padding: 22px 24px;\">\n        <div style=\"font-size: 11px; font-weight: 700; color: var(--sv-text-faint); font-family: var(--sv-font-mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px;\">Información básica<\u002Fdiv>\n\n        <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Nombre del agente<\u002Flabel>\n        <input type=\"text\" placeholder=\"ej. qa-story-reviewer\" value=\"{{ name }}\" sc-camel-on-input=\"{{ onNameChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-mono); font-size: 13.5px; background: var(--sv-bg-soft); color: var(--sv-text); margin-bottom: 16px;\">\n\n        <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Descripción breve<\u002Flabel>\n        <textarea rows=\"2\" placeholder=\"Qué hace este agente, en una frase.\" value=\"{{ description }}\" sc-camel-on-input=\"{{ onDescriptionChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-display); font-size: 13.5px; background: var(--sv-bg-soft); color: var(--sv-text); resize: vertical; margin-bottom: 16px;\"><\u002Ftextarea>\n\n        <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Responsabilidad principal<\u002Flabel>\n        <textarea rows=\"3\" placeholder=\"Qué debe cumplir este agente para considerarse exitoso.\" value=\"{{ responsibility }}\" sc-camel-on-input=\"{{ onResponsibilityChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-display); font-size: 13.5px; background: var(--sv-bg-soft); color: var(--sv-text); resize: vertical; margin-bottom: 16px;\"><\u002Ftextarea>\n\n        <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">System prompt<\u002Flabel>\n        <textarea rows=\"6\" placeholder=\"Instrucciones de sistema que definen el comportamiento del agente...\" value=\"{{ systemPrompt }}\" sc-camel-on-input=\"{{ onSystemPromptChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-mono); font-size: 12.5px; line-height: 1.5; background: var(--sv-bg-soft); color: var(--sv-text); resize: vertical;\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div style=\"background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: 12px; box-shadow: var(--sv-shadow-sm); padding: 22px 24px;\">\n        <div style=\"font-size: 11px; font-weight: 700; color: var(--sv-text-faint); font-family: var(--sv-font-mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px;\">Entregables<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px;\">\n          <sc-for list=\"{{ deliverables }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div style=\"display: flex; align-items: center; gap: 8px; background: var(--sv-bg-soft); border: 1px solid var(--sv-border); border-radius: 8px; padding: 9px 12px;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--sv-teal)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n              <span style=\"flex: 1; font-size: 13.5px;\">{{ d.text }}<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ d.remove }}\" aria-label=\"Eliminar entregable\" style=\"background: none; border: none; padding: 2px; cursor: pointer; color: var(--sv-text-faint);\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px;\">\n          <input type=\"text\" placeholder=\"ej. Reporte de diagnóstico\" value=\"{{ newDeliverable }}\" sc-camel-on-input=\"{{ onNewDeliverableChange }}\" sc-camel-on-key-down=\"{{ onNewDeliverableKeyDown }}\" style=\"flex: 1; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-display); font-size: 13px; background: var(--sv-bg-soft); color: var(--sv-text);\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onAddDeliverable }}\" style=\"padding: 0 16px; border-radius: 8px; border: 1px solid var(--sv-border-strong); background: var(--sv-surface); color: var(--sv-text); font-family: var(--sv-font-display); font-weight: 600; font-size: 13px; cursor: pointer;\">+ Añadir<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: 12px; box-shadow: var(--sv-shadow-sm); padding: 22px 24px;\">\n        <div style=\"font-size: 11px; font-weight: 700; color: var(--sv-text-faint); font-family: var(--sv-font-mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px;\">Configuración<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;\">\n          <div>\n            <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Owner / equipo<\u002Flabel>\n            <input type=\"text\" placeholder=\"ej. Equipo QA\" value=\"{{ owner }}\" sc-camel-on-input=\"{{ onOwnerChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-display); font-size: 13.5px; background: var(--sv-bg-soft); color: var(--sv-text);\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Modelo LLM base<\u002Flabel>\n            <sc-raw-select value=\"{{ model }}\" sc-camel-on-change=\"{{ onModelChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-mono); font-size: 13px; background: var(--sv-bg-soft); color: var(--sv-text); cursor: pointer;\">\n              <sc-for list=\"{{ modelOptionGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n                <optgroup label=\"{{ grp.provider }}\">\n                  <sc-for list=\"{{ grp.models }}\" as=\"m\" hint-placeholder-count=\"2\">\n                    <option value=\"{{ m.id }}\">{{ m.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Foptgroup>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: relative; margin-bottom: 16px;\">\n            <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Harness<\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ onToggleHarnessDropdown }}\" style=\"width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-mono); font-size: 13px; background: var(--sv-bg-soft); color: var(--sv-text); cursor: pointer;\">\n              <span style=\"text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ harnessSummary }}<\u002Fspan>\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0;\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <sc-if value=\"{{ isHarnessDropdownOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: 8px; box-shadow: var(--sv-shadow-md); padding: 6px; z-index: 20;\">\n                <sc-for list=\"{{ harnessOptions }}\" as=\"h\" hint-placeholder-count=\"5\">\n                  <label style=\"display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 6px; cursor: pointer; font-family: var(--sv-font-mono); font-size: 13px;\">\n                    <input type=\"checkbox\" checked=\"{{ h.checked }}\" sc-camel-on-change=\"{{ h.toggle }}\" style=\"width: 15px; height: 15px; accent-color: var(--sv-accent); cursor: pointer;\">\n                    {{ h.label }}\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n        <\u002Fdiv>\n        <label style=\"display: block; font-size: 12.5px; font-weight: 600; color: var(--sv-text-muted); margin-bottom: 6px;\">Estado<\u002Flabel>\n        <div style=\"display: flex; gap: 8px;\">\n          <sc-for list=\"{{ statusOptions }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ st.select }}\" style=\"{{ st.style }}\">{{ st.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 14px; position: sticky; top: 20px;\">\n      <div style=\"font-size: 11px; font-weight: 700; color: var(--sv-text-faint); font-family: var(--sv-font-mono); text-transform: uppercase; letter-spacing: 0.05em;\">Asignar skills<\u002Fdiv>\n      <p style=\"margin: -8px 0 4px; font-size: 12.5px; color: var(--sv-text-muted);\">Arrastra un skill del catálogo hacia la lista de asignados, o usa el botón +.<\u002Fp>\n\n      <div style=\"background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: 12px; box-shadow: var(--sv-shadow-sm); padding: 16px 18px;\">\n        <input type=\"text\" placeholder=\"Buscar en el catálogo...\" value=\"{{ skillSearch }}\" sc-camel-on-input=\"{{ onSkillSearchChange }}\" style=\"width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid var(--sv-border); border-radius: 8px; font-family: var(--sv-font-display); font-size: 13px; background: var(--sv-bg-soft); color: var(--sv-text); margin-bottom: 12px;\">\n        <div sc-camel-on-drag-over=\"{{ onZoneDragOver }}\" sc-camel-on-drop=\"{{ onCatalogDrop }}\" style=\"display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto;\">\n          <sc-for list=\"{{ availableSkills }}\" as=\"sk\" hint-placeholder-count=\"4\">\n            <div draggable=\"true\" sc-camel-on-drag-start=\"{{ sk.onDragStart }}\" sc-camel-on-click=\"{{ sk.assign }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border: 1px solid var(--sv-border); border-radius: 8px; cursor: grab; background: var(--sv-bg-soft);\">\n              <div>\n                <div style=\"font-family: var(--sv-font-mono); font-size: 12.5px; font-weight: 600;\">{{ sk.name }}<\u002Fdiv>\n                <div style=\"font-size: 11px; color: var(--sv-text-faint); margin-top: 2px;\">{{ sk.category }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size: 15px; color: var(--sv-accent); flex-shrink: 0;\">+<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ hasNoAvailableSkills }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 4px 0; font-size: 12.5px; color: var(--sv-text-faint); text-align: center;\">Sin coincidencias.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div sc-camel-on-drag-over=\"{{ onZoneDragOver }}\" sc-camel-on-drop=\"{{ onAssignedDrop }}\" style=\"background: var(--sv-bg-soft); border: 2px dashed var(--sv-border-strong); border-radius: 12px; padding: 16px 18px; min-height: 160px;\">\n        <div style=\"font-size: 11px; font-weight: 700; color: var(--sv-text-faint); font-family: var(--sv-font-mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;\">Skills asignados ({{ assignedCount }})<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <sc-for list=\"{{ assignedSkills }}\" as=\"sk\" hint-placeholder-count=\"2\">\n            <div draggable=\"true\" sc-camel-on-drag-start=\"{{ sk.onDragStart }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border: 1px solid rgba(var(--sv-accent-rgb),0.35); background: rgba(var(--sv-accent-rgb),0.08); border-radius: 8px; cursor: grab;\">\n              <div>\n                <div style=\"font-family: var(--sv-font-mono); font-size: 12.5px; font-weight: 600; color: var(--sv-accent-dark);\">{{ sk.name }}<\u002Fdiv>\n                <div style=\"font-size: 11px; color: var(--sv-text-faint); margin-top: 2px;\">{{ sk.category }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ sk.unassign }}\" aria-label=\"Quitar skill\" style=\"background: none; border: none; padding: 2px; cursor: pointer; color: var(--sv-accent-dark); flex-shrink: 0;\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ hasNoAssignedSkills }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin: 4px 0; font-size: 12.5px; color: var(--sv-text-faint); text-align: center;\">Suelta aquí los skills que debe usar este agente.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n<\u002Fdc-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CATALOG_SKILLS = [\n  { id: 1, name: 'evaluate-user-story-skill', category: 'CODE' },\n  { id: 2, name: 'report-userstory-testcase', category: 'REQUIREMENTS' },\n  { id: 3, name: 'k8s-cluster-diagnostic', category: 'INFRA' },\n  { id: 4, name: 'k8s-node-autoscaler', category: 'INFRA' },\n  { id: 5, name: 'informe-mensual-horas-proyecto', category: 'FINANCE' },\n  { id: 6, name: 'react-component-scaffold', category: 'UI / FRONTEND' },\n  { id: 7, name: 'agent-memory-planner', category: 'AI & AGENTS' },\n  { id: 8, name: 'sql-migration-linter', category: 'CODE' },\n];\n\nconst HARNESS_CHOICES = ['claude', 'codex', 'opencode', 'agy', 'cursor'];\nconst MODEL_GROUPS = [\n  { provider: 'Anthropic', models: [{ id: 'claude-opus-4.1', label: 'Claude Opus 4.1' }, { id: 'claude-sonnet-4.5', label: 'Claude Sonnet 4.5' }, { id: 'claude-3-5-haiku', label: 'Claude 3.5 Haiku' }] },\n  { provider: 'OpenAI', models: [{ id: 'gpt-5', label: 'GPT-5' }, { id: 'gpt-4o', label: 'GPT-4o' }, { id: 'o4-mini', label: 'o4-mini' }] },\n  { provider: 'Google', models: [{ id: 'gemini-2.5-pro', label: 'Gemini 2.5 Pro' }, { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash' }] },\n];\nconst STATUSES = [\n  { id: 'activo', label: 'Activo' },\n  { id: 'borrador', label: 'Borrador' },\n  { id: 'pausado', label: 'Pausado' },\n];\n\nclass Component extends DCLogic {\n  state = {\n    name: 'qa-story-reviewer',\n    description: 'Revisa historias de usuario antes de pasar a desarrollo y valida sus criterios de aceptación.',\n    responsibility: 'Revisar historias de usuario y validar que los criterios de aceptación estén completos y sean verificables antes de que el equipo comience el desarrollo.',\n    systemPrompt: 'Eres un revisor experto de historias de usuario. Analiza cada historia y sus criterios de aceptación, identifica ambigüedades o casos no cubiertos, y responde con un checklist claro de aprobación o rechazo.',\n    deliverables: ['Checklist de aceptación', 'Reporte de casos de prueba', 'Aprobación o rechazo de la historia'],\n    newDeliverable: '',\n    owner: 'Equipo QA',\n    model: 'claude-sonnet-4.5',\n    harnesses: ['claude'],\n    isHarnessDropdownOpen: false,\n    status: 'activo',\n    skillSearch: '',\n    assignedSkillIds: [1, 2],\n    draggingId: null,\n  };\n\n  onNameChange = (e) => this.setState({ name: e.target.value });\n  onDescriptionChange = (e) => this.setState({ description: e.target.value });\n  onResponsibilityChange = (e) => this.setState({ responsibility: e.target.value });\n  onSystemPromptChange = (e) => this.setState({ systemPrompt: e.target.value });\n  onOwnerChange = (e) => this.setState({ owner: e.target.value });\n  onModelChange = (e) => this.setState({ model: e.target.value });\n  onToggleHarnessDropdown = () => this.setState((s) => ({ isHarnessDropdownOpen: !s.isHarnessDropdownOpen }));\n  onToggleHarness = (h) => this.setState((s) => ({\n    harnesses: s.harnesses.includes(h) ? s.harnesses.filter((x) => x !== h) : [...s.harnesses, h],\n  }));\n  onSelectStatus = (status) => this.setState({ status });\n  onSkillSearchChange = (e) => this.setState({ skillSearch: e.target.value });\n\n  onNewDeliverableChange = (e) => this.setState({ newDeliverable: e.target.value });\n  onAddDeliverable = () => {\n    const text = this.state.newDeliverable.trim();\n    if (!text) return;\n    this.setState((s) => ({ deliverables: [...s.deliverables, text], newDeliverable: '' }));\n  };\n  onNewDeliverableKeyDown = (e) => { if (e.key === 'Enter') { e.preventDefault(); this.onAddDeliverable(); } };\n  removeDeliverable = (idx) => this.setState((s) => ({ deliverables: s.deliverables.filter((_, i) => i !== idx) }));\n\n  assignSkill = (id) => this.setState((s) => (s.assignedSkillIds.includes(id) ? s : { assignedSkillIds: [...s.assignedSkillIds, id] }));\n  unassignSkill = (id) => this.setState((s) => ({ assignedSkillIds: s.assignedSkillIds.filter((x) => x !== id) }));\n\n  onDragStart = (id, e) => { this.state.draggingId = id; e.dataTransfer.setData('text/plain', String(id)); };\n  onZoneDragOver = (e) => e.preventDefault();\n  onAssignedDrop = (e) => {\n    e.preventDefault();\n    const id = Number(e.dataTransfer.getData('text/plain')) || this.state.draggingId;\n    if (id) this.assignSkill(id);\n  };\n  onCatalogDrop = (e) => {\n    e.preventDefault();\n    const id = Number(e.dataTransfer.getData('text/plain')) || this.state.draggingId;\n    if (id) this.unassignSkill(id);\n  };\n\n  renderVals() {\n    const { name, description, responsibility, systemPrompt, deliverables, newDeliverable, owner, model, harnesses, isHarnessDropdownOpen, status, skillSearch, assignedSkillIds } = this.state;\n\n    const harnessOptions = HARNESS_CHOICES.map((h) => ({ label: h, checked: harnesses.includes(h), toggle: () => this.onToggleHarness(h) }));\n    const harnessSummary = harnesses.length === 0 ? 'Seleccionar harness' : harnesses.join(', ');\n\n    const segBase = 'padding:8px 16px; border-radius:6px; border:1px solid var(--sv-border-strong); font-family:\\'Space Grotesk\\',sans-serif; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;';\n    const seg = (active) => active\n      ? segBase + 'background:var(--sv-accent); color:var(--sv-surface); border-color:var(--sv-accent);'\n      : segBase + 'background:var(--sv-surface); color:var(--sv-text-muted);';\n\n    const statusOptions = STATUSES.map((s) => ({ ...s, select: () => this.onSelectStatus(s.id), style: seg(s.id === status) }));\n\n    const deliverableItems = deliverables.map((text, idx) => ({ text, remove: () => this.removeDeliverable(idx) }));\n\n    const search = skillSearch.trim().toLowerCase();\n    const availableSkills = CATALOG_SKILLS\n      .filter((sk) => !assignedSkillIds.includes(sk.id))\n      .filter((sk) => !search || sk.name.toLowerCase().includes(search) || sk.category.toLowerCase().includes(search))\n      .map((sk) => ({ ...sk, assign: () => this.assignSkill(sk.id), onDragStart: (e) => this.onDragStart(sk.id, e) }));\n\n    const assignedSkills = assignedSkillIds\n      .map((id) => CATALOG_SKILLS.find((sk) => sk.id === id))\n      .filter(Boolean)\n      .map((sk) => ({ ...sk, unassign: () => this.unassignSkill(sk.id), onDragStart: (e) => this.onDragStart(sk.id, e) }));\n\n    return {\n      breadcrumb: [\n        { label: 'Inicio', color: 'var(--sv-text-muted)', weight: 400, hasSeparator: true },\n        { label: 'Agentes IA', color: 'var(--sv-text-muted)', weight: 400, hasSeparator: true },\n        { label: 'Crear agente', color: 'var(--sv-text)', weight: 600, hasSeparator: false },\n      ],\n      pageActions: [\n        { label: 'Cancelar', variant: 'secondary', onClick: () => { window.location.href = './Agentes IA.dc.html'; } },\n        { label: 'Guardar agente', variant: 'primary', onClick: () => { window.location.href = './Agentes IA.dc.html'; } },\n      ],\n      name, onNameChange: this.onNameChange,\n      description, onDescriptionChange: this.onDescriptionChange,\n      responsibility, onResponsibilityChange: this.onResponsibilityChange,\n      systemPrompt, onSystemPromptChange: this.onSystemPromptChange,\n      deliverables: deliverableItems,\n      newDeliverable, onNewDeliverableChange: this.onNewDeliverableChange, onNewDeliverableKeyDown: this.onNewDeliverableKeyDown, onAddDeliverable: this.onAddDeliverable,\n      owner, onOwnerChange: this.onOwnerChange,\n      model, onModelChange: this.onModelChange, modelOptionGroups: MODEL_GROUPS,\n      harnessOptions, harnessSummary, isHarnessDropdownOpen, onToggleHarnessDropdown: this.onToggleHarnessDropdown,\n      statusOptions,\n      skillSearch, onSkillSearchChange: this.onSkillSearchChange,\n      availableSkills, hasNoAvailableSkills: availableSkills.length === 0,\n      assignedSkills, assignedCount: assignedSkills.length, hasNoAssignedSkills: assignedSkills.length === 0,\n      onZoneDragOver: this.onZoneDragOver,\n      onAssignedDrop: this.onAssignedDrop,\n      onCatalogDrop: this.onCatalogDrop,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
