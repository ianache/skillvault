<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SkillVault - Layout Solutions Visualizer</title>
  <style>
    :root {
      --sv-bg: #13120f;
      --sv-surface: #1c1a17;
      --sv-border: #2e2a24;
      --sv-text: #e6dfd5;
      --sv-muted: #a3988c;
      --sv-accent: #e8ab6a;
      --sv-accent-dim: rgba(232, 171, 106, 0.1);
      --sv-green: #2eca8a;
      --sv-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--sv-bg);
      color: var(--sv-text);
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Control Panel top bar */
    .control-panel {
      background: #0d0c0a;
      border-bottom: 2px solid var(--sv-accent);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .control-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--sv-accent);
      font-family: monospace;
      letter-spacing: 0.1em;
    }

    .toggle-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--sv-border);
      background: var(--sv-surface);
      color: var(--sv-text);
    }

    .btn:hover {
      border-color: var(--sv-accent);
    }

    .btn.active {
      background: var(--sv-accent);
      color: #13120f;
      border-color: var(--sv-accent);
    }

    /* App Chrome Container */
    .app-chrome {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
    }

    /* Sidebar simulation */
    .app-sidebar {
      width: 240px;
      background: #0d0c0a;
      border-right: 1px solid var(--sv-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--sv-accent);
      font-size: 16px;
    }

    .menu-item {
      font-size: 13px;
      color: var(--sv-muted);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu-item.active {
      color: var(--sv-accent);
      background: var(--sv-accent-dim);
      font-weight: 600;
    }

    /* Main Body Area */
    .app-main {
      flex: 1;
      overflow-y: auto;
      background: var(--sv-bg);
      display: flex;
      flex-direction: column;
    }

    .header-block {
      border-bottom: 1px solid var(--sv-border);
      padding: 24px;
      background: var(--sv-surface);
    }

    .breadcrumb {
      font-size: 12px;
      color: var(--sv-muted);
      margin-bottom: 8px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--sv-text);
    }

    .badge-pending {
      font-size: 11px;
      font-weight: 600;
      color: var(--sv-accent);
      border: 1px solid var(--sv-accent);
      background: var(--sv-accent-dim);
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Tab bar simulation */
    .tab-bar {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid var(--sv-border);
      margin-top: 16px;
    }

    .tab-item {
      font-size: 13px;
      font-weight: 600;
      color: var(--sv-muted);
      padding: 8px 4px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-item.active {
      color: var(--sv-accent);
      border-bottom-color: var(--sv-accent);
    }

    /* Content Area Layout Containers */
    .workspace {
      padding: 24px;
      flex: 1;
    }

    /* SOLUTION 1: SPLIT LAYOUT STYLE */
    .layout-split {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      width: 100%;
    }

    /* SOLUTION 2: AUTOCOMPACTABLE STYLE */
    .layout-autocompact {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Generic layout blocks */
    .card {
      background: var(--sv-surface);
      border: 1px solid var(--sv-border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .code-viewer {
      background: #0d0c0a;
      border: 1px solid var(--sv-border);
      border-radius: 6px;
      padding: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--sv-text);
      overflow-x: auto;
    }

    /* Center constrain for Solution 2 text block */
    .text-constrain-s2 {
      max-width: 750px;
      margin: 20px 0;
    }

    /* Comment Thread items */
    .comment {
      border-bottom: 1px solid var(--sv-border);
      padding: 12px 0;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .comment-author {
      font-weight: 700;
      color: var(--sv-text);
    }

    .comment-date {
      color: var(--sv-muted);
    }

    .comment-body {
      font-size: 13px;
      color: var(--sv-muted);
      line-height: 1.5;
    }

    /* Timeline events */
    .timeline-item {
      display: flex;
      gap: 12px;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .timeline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sv-accent);
      margin-top: 4px;
    }

    .timeline-content {
      color: var(--sv-muted);
    }

    .timeline-date {
      color: var(--sv-muted);
      font-size: 10px;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <!-- Top control panel -->
  <div class="control-panel">
    <div class="control-title">PRIME RADIANT - MOCKUP INTERACTIVO</div>
    <div class="toggle-group">
      <button id="btn-s1" class="btn active" onclick="switchLayout(1)">Ver Solución 1 (Panel Dividido)</button>
      <button id="btn-s2" class="btn" onclick="switchLayout(2)">Ver Solución 2 (Autocompactable)</button>
    </div>
    <div style="font-size: 12px; color: var(--sv-muted);">SkillVault v2.0</div>
  </div>

  <!-- App Chrome Wrapper -->
  <div class="app-chrome">
    <!-- Sidebar simulation -->
    <div class="app-sidebar">
      <div class="logo">
        <span style="font-size: 18px;">◈</span> SkillVault
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div class="menu-item">Mis Skills</div>
        <div class="menu-item">Publicar Skill</div>
        <div class="menu-item active">Mis propuestas</div>
        <div class="menu-item">Gestión de roles</div>
      </div>
    </div>

    <!-- Main area -->
    <div class="app-main">
      <!-- Header -->
      <div class="header-block">
        <div class="breadcrumb">Mis propuestas / Propuesta #42</div>
        <div class="title-row">
          <h1 class="page-title">Deploy Docker Container</h1>
          <span class="badge-pending">Pendiente de revisión</span>
        </div>
        <div class="tab-bar">
          <div class="tab-item active">SKILL.md</div>
          <div class="tab-item">Adjuntos</div>
          <div class="tab-item">Comentarios (2)</div>
          <div class="tab-item">Metadata</div>
        </div>
      </div>

      <!-- Dynamic Workspace Content -->
      <div class="workspace" id="workspace-container">
        <!-- RENDER INJECTED HERE BY JAVASCRIPT -->
      </div>
    </div>
  </div>

  <script>
    // Templates
    const s1_html = `
      <div class="layout-split">
        <!-- Columna Principal Izquierda (70%) -->
        <div>
          <div class="card" style="margin-bottom: 16px;">
            <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--sv-accent);">Código de SKILL.md</h3>
            <pre class="code-viewer">---
name: deploy-docker-container
description: Deploy any Docker container with customized network and volume rules.
version: 1.0.0
author: "@jsalazar"
compatibility:
  - claude
triggers:
  - "despliega el contenedor docker de postgres"
  - "corre una imagen de redis local"
---

# Deploy Docker Container

Este skill automatiza el despliegue de contenedores Docker de forma rápida y segura en entornos de desarrollo local.</pre>
          </div>

          <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--sv-text);">Comentarios del Archivo</h3>
            <div class="comment">
              <div class="comment-header">
                <span class="comment-author">@mrodriguez (Revisor)</span>
                <span class="comment-date">Ayer, 18:24</span>
              </div>
              <p class="comment-body">La descripción es sumamente clara. Sería prudente añadir por defecto la compatibilidad con harnesses locales alternativos.</p>
            </div>
            <div class="comment" style="border: none; padding-bottom: 0;">
              <div class="comment-header">
                <span class="comment-author">@jsalazar (Autor)</span>
                <span class="comment-date">Hoy, 09:12</span>
              </div>
              <p class="comment-body">¡Perfecto! Ya agregué el soporte en la definición de la imagen base.</p>
            </div>
          </div>
        </div>

        <!-- Columna de Control Derecha (30%) -->
        <div>
          <div class="card" style="border-color: var(--sv-accent); background: rgba(232, 171, 106, 0.03);">
            <h3 style="font-size: 13px; margin-bottom: 8px; color: var(--sv-accent); text-transform: uppercase; letter-spacing: 0.5px;">Acciones de Solicitud</h3>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button class="btn active" style="width: 100%; border:none; background: var(--sv-green); color: #fff;">✓ Aprobar Propuesta</button>
              <button class="btn" style="width: 100%;">Pedir cambios</button>
              <button class="btn" style="width: 100%; border-color: var(--sv-red); color: var(--sv-red);">Rechazar</button>
            </div>
          </div>

          <div class="card">
            <h3 style="font-size: 13px; margin-bottom: 12px; color: var(--sv-text);">Línea de Tiempo</h3>
            <div class="timeline-item">
              <div class="timeline-dot"></div>
              <div class="timeline-content">Propuesta enviada por @jsalazar</div>
            </div>
            <div class="timeline-item">
              <div class="timeline-dot" style="background: var(--sv-accent);"></div>
              <div class="timeline-content">Revisor @mrodriguez asignado</div>
            </div>
            <div class="timeline-item" style="margin-bottom: 0;">
              <div class="timeline-dot" style="background: var(--sv-green);"></div>
              <div class="timeline-content">Validación estática exitosa (127 pruebas)</div>
            </div>
          </div>
        </div>
      </div>
    `;

    const s2_html = `
      <div class="layout-autocompact">
        <!-- Bloque de Trabajo Ancho Completo (1200px) -->
        <div class="card" style="margin-bottom: 16px;">
          <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--sv-accent);">Código de SKILL.md (Contenedor de 1200px)</h3>
          <pre class="code-viewer">---
name: deploy-docker-container
description: Deploy any Docker container with customized network and volume rules.
version: 1.0.0
author: "@jsalazar"
compatibility:
  - claude
triggers:
  - "despliega el contenedor docker de postgres"
  - "corre una imagen de redis local"
---

# Deploy Docker Container

Este skill automatiza el despliegue de contenedores Docker de forma rápida y segura en entornos de desarrollo local.</pre>
        </div>

        <!-- Bloque de Comentarios Compactado a 750px para lectura confortable del ojo humano -->
        <div class="text-constrain-s2">
          <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--sv-text);">Comentarios del Archivo (Ancho Óptimo de Lectura - 750px)</h3>
            <div class="comment">
              <div class="comment-header">
                <span class="comment-author">@mrodriguez (Revisor)</span>
                <span class="comment-date">Ayer, 18:24</span>
              </div>
              <p class="comment-body">La descripción es sumamente clara. Sería prudente añadir por defecto la compatibilidad con harnesses locales alternativos de forma consistente con las directivas del sistema operativo activo.</p>
            </div>
            <div class="comment" style="border: none; padding-bottom: 0;">
              <div class="comment-header">
                <span class="comment-author">@jsalazar (Autor)</span>
                <span class="comment-date">Hoy, 09:12</span>
              </div>
              <p class="comment-body">¡Perfecto! Ya agregué el soporte en la definición de la imagen base. Compila y pasa todas las pruebas unitarias al 100%.</p>
            </div>
          </div>

          <div class="card">
            <h3 style="font-size: 13px; margin-bottom: 12px; color: var(--sv-text);">Línea de Tiempo y Seguimiento</h3>
            <div class="timeline-item">
              <div class="timeline-dot"></div>
              <div class="timeline-content">Propuesta enviada por @jsalazar</div>
            </div>
            <div class="timeline-item">
              <div class="timeline-dot" style="background: var(--sv-accent);"></div>
              <div class="timeline-content">Revisor @mrodriguez asignado</div>
            </div>
            <div class="timeline-item" style="margin-bottom: 0;">
              <div class="timeline-dot" style="background: var(--sv-green);"></div>
              <div class="timeline-content">Validación estática exitosa (127 pruebas)</div>
            </div>
          </div>
        </div>
      </div>
    `;

    function switchLayout(sol) {
      const container = document.getElementById("workspace-container");
      const btn1 = document.getElementById("btn-s1");
      const btn2 = document.getElementById("btn-s2");

      if (sol === 1) {
        container.innerHTML = s1_html;
        btn1.classList.add("active");
        btn2.classList.remove("active");
      } else {
        container.innerHTML = s2_html;
        btn1.classList.remove("active");
        btn2.classList.add("active");
      }
    }

    // Initialize with S1
    switchLayout(1);
  </script>
</body>
</html>
